<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="داشبورد لحظه‌ای ارزهای دیجیتال با نمودار، قیمت، و درصد تغییرات"
    />
    <meta
      name="keywords"
      content="رمزارز, بیت‌کوین, ارز دیجیتال, داشبورد, قیمت ارز"
    />
    <title>داشبورد ارز دیجیتال</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">
      <header dir="rtl">
        <h1>داشبورد ارز دیجیتال</h1>
        <button data-theme-toggle aria-label="Change theme">
          <span class="icon">🌞</span>
        </button>
      </header>

      <table id="crypto-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Price</th>
            <th>1h %</th>
            <th>24h %</th>
            <th>7d %</th>
            <th>Chart</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="7">
              <div class="loading">در حال بارگذاری... ⏳</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="assets/js/app.js"></script>
  </body>
</html>
